<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e0234e'/%3E%3Cpath d='M11 21.5V11h2.6l5 6.4V11H21v10.5h-2.5l-5.2-6.6v6.6z' fill='white'/%3E%3C/svg%3E" />
    <title>NestJS 文档 · 中英对照</title>
    <meta name="description" content="NestJS 官方文档中英对照阅读器：左侧英文原文，右侧中文译文，滚动同步。" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nest-docs-theme');
          var dark = t ? t === 'dark' : true;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
